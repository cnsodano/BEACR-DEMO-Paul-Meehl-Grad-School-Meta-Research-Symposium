name: Environment Hack

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Install TinyTeX so that rmarkdown can render to pdf
        run: wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh

      - name: 
        run: Rscript -e 'rmarkdown::render("03_environment_hacking/environment_hack.Rmd", rmarkdown::pdf_document())'

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-rendered RMarkdown [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

