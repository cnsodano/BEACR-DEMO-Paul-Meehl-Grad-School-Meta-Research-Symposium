name: Coin Flip with beacr

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: clean dev seed log
      - run: Rscript -e "beacr::reset_seed_log(purge_all=TRUE, yes_to_all=TRUE)"

      - name: Render
        run: Rscript -e 'rmarkdown::render("seed_hacking_demo.Rmd")'

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-rendered RMarkdown [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi